services:
  jobsearcher:
    build: .
    image: jobsearcher:local
    container_name: jobsearcher
    restart: unless-stopped
    command: ["daemon"]
    env_file: .env
    environment:
      TZ: Europe/Stockholm
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./ranking.yaml:/config/ranking.yaml:ro
      # Target companies; copy companies.example.yaml first (Docker would otherwise
      # create an empty directory here, which is treated as "no companies").
      - ./companies.yaml:/config/companies.yaml:ro
      - ./cvs:/cvs:ro
      # One folder per candidate, once `jobsearcher migrate-profiles` has made them.
      - ./profiles:/config/profiles:ro
      - ./data:/data

  # Local web UI on port 8080. It needs no secrets, so there is no env_file. The config
  # files and cvs/ are read-write so the Settings page can edit them (each save is
  # backed up to data/backups/); data/ is read-write for SQLite's WAL files and
  # application tracking. It needs a login (jobsearcher users add), but has no HTTPS of
  # its own: Docker's published ports bypass ufw and
  # firewalld, so on a server with a public IP set WEB_BIND to a LAN or Tailscale address.
  web:
    image: jobsearcher:local
    container_name: jobsearcher-web
    restart: unless-stopped
    command: ["web", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      TZ: Europe/Stockholm
    ports:
      - "${WEB_BIND:-0.0.0.0}:8080:8080"
    volumes:
      - ./config.yaml:/config/config.yaml
      - ./ranking.yaml:/config/ranking.yaml
      - ./companies.yaml:/config/companies.yaml
      - ./cvs:/cvs
      - ./profiles:/config/profiles
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 60s
