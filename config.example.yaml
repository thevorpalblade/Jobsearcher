# Copy to config.yaml and edit. API keys and tokens go in .env (see .env.example).

search:
  # The target roles (and their aliases) in ranking.yaml are searched automatically.
  # Add any extra free-text queries here.
  use_target_roles: true
  keywords: []
  # Ads whose title or text contain any of these are dropped.
  exclude_keywords:
    - "konsultuppdrag"
  # Matched (case-insensitive substring) against the ad's municipality, city and
  # region. "Stockholm" also matches "Stockholms län", so the whole county is
  # included. Empty = all of Sweden.
  locations:
    - "Stockholm"
    - "Göteborg"
    - "Gothenburg"
    - "Malmö"
    - "Lund"
    - "Uppsala"
  include_remote: true
  expire_after_days: 3

sources:
  platsbanken: true
  jobtech_links: true
  companies: true          # careers-site feeds of the companies in companies.yaml
  # LinkedIn and Indeed (also glassdoor, google) via JobSpy: pip install '.[jobspy]'.
  # Scrapes the sites' public pages without a login, against their terms of service;
  # keep the volume low. Searches the same keywords as the other sources.
  jobspy:
    sites: []                # e.g. [linkedin, indeed]; empty = off
    location: Sweden         # search.locations then keeps your cities
    hours_old: 168           # ads from the last week, each run
    results_per_search: 20
    max_age_days: 30         # these jobs expire by age (older ads aren't re-fetched)
    pause_s: 5               # between searches, against rate limiting

# How the crawler presents itself (company sites, ATS feeds, news). Per-host pacing
# always applies. For a personal, low-volume setup you may prefer:
#   user_agent: chrome     # some sites refuse non-browser user agents
#   respect_robots: false  # also unlocks Google News for the news signals
crawl:
  user_agent: honest           # honest | chrome | any literal User-Agent string
  respect_robots: true

# Target companies (companies.yaml): crawling and news signals.
companies:
  redetect_after_days: 7       # re-check which ATS each company uses
  min_request_interval_s: 1.0  # pause between requests to the same host
  signals_every_days: 7        # `jobsearcher run` fetches/classifies news this often
  news_days: 30                # news window for signals and the digest
  news_source: auto            # auto | google_news | gdelt (auto: Google News unless
                               # crawl.respect_robots is on; its robots.txt disallows it)

llm:
  # Each role picks its own provider, so they can be mixed:
  #   moonshot    - Kimi, pay per token (MOONSHOT_API_KEY)
  #   anthropic   - Claude API, pay per token (ANTHROPIC_API_KEY)
  #   nvidia      - models on NVIDIA's serverless endpoints, e.g. GLM (NVIDIA_API_KEY)
  #   zai         - GLM from Z.ai, its maker; pay per token, cheap (ZAI_API_KEY)
  #   ollama      - a model on this machine through Ollama (no key; `ollama pull <model>`)
  #   claude_code - Claude via the Claude Code CLI on your Claude Pro/Max subscription
  #                 (CLAUDE_CODE_OAUTH_TOKEN); counts against the subscription's usage
  #                 limits instead of the $ budget. Best for low-volume drafting.
  ranking:
    provider: moonshot
    model: kimi-k2.6            # cheaper model: scores every new job
  drafting:
    provider: claude_code
    model: opus                 # alias or full model ID, e.g. claude-opus-5-5
    effort: medium              # low | medium | high | xhigh | max

  # Alternatives:
  # drafting:
  #   provider: moonshot
  #   model: kimi-k3
  # ranking:
  #   provider: anthropic
  #   model: claude-haiku-4-5
  # ranking:                    # free but rate-limited and slow (NVIDIA_API_KEY)
  #   provider: nvidia
  #   model: z-ai/glm-5.3-flash
  #   extra_body: {thinking: {type: disabled}}   # skip reasoning; the JSON is enough
  #   enforce_schema: true      # server enforces the JSON schema (response_format json_schema)
  #   max_parallel: 4           # concurrent requests; the free tier queues each one
  # ranking:                    # the same GLM, paid, no free-tier queue
  #   provider: zai
  #   model: glm-5.3-flash
  #   extra_body: {reasoning_effort: low}   # Z.ai can't turn its thinking off
  #   max_parallel: 4
  # ranking:                    # local; Qwen3 8B fits a 10 GB GPU but scored loosely
  #   provider: ollama
  #   model: qwen3:8b
  #   extra_body: {reasoning_effort: none}
  #   enforce_schema: true
  #   timeout_s: 300
  # Compare candidates on a fixed set of jobs first: scripts/rank_benchmark.py.

  # Drafts are checked claim by claim against your CVs by a second model (default: the
  # ranking model, with a 150 s time limit so a busy free tier can't stall a draft).
  # If it is too slow or down, this model checks instead:
  # grounding_fallback: {provider: claude_code, model: haiku}   # quick, on the subscription
  # grounding: {provider: nvidia, model: z-ai/glm-5.3-flash, timeout_s: 150, max_retries: 0}

  # NVIDIA's free hosted API allows about 40 requests a minute per key (shared by all models)
  # and answers 429 beyond it. Every NVIDIA request, retries included, is spaced to stay
  # under this; 0 turns the limiter off (e.g. on a paid plan or a raised limit).
  nvidia_requests_per_minute: 30
  # Moonshot's limit depends on the account's tier: a new account gets 3 requests a minute.
  # moonshot_requests_per_minute: 3   # 0 (default) = no limiter
  # zai_requests_per_minute: 0        # Z.ai doesn't publish its paid limits

  # With several candidates (profiles/, docs/m10-multi-user.md): the profiles that use
  # this file's models and the keys in .env, and may use claude_code and ollama (your
  # own subscription and GPU). Every other profile picks its own models and enters its
  # own keys on Settings → Models and keys. `migrate-profiles` adds the first one.
  # server_key_profiles: [jenny]

  monthly_budget_usd: 20
  drafting_budget_share: 0.8    # drafting pauses at 80% of the budget, ranking at 100%
  # Prices (USD per million tokens) for models not in the built-in table:
  # prices:
  #   some-model: {input: 1.0, output: 5.0, cache_read: 0.1}

schedule:
  daily_at: "06:00"
  # If ranking or news classification stops because the provider keeps failing (a rate
  # limit, an outage), try again after this many minutes, up to `retries` times and never
  # into the next daily run. 0 retries = wait for the next daily run.
  retry_minutes: 30
  retries: 16
  timezone: "Europe/Stockholm"

# Relative paths are resolved against this file's directory.
data_dir: "data"
ranking_config: "ranking.yaml"   # target roles, preferences, score weights
cv_path: "cvs/master.md"         # master CV in Markdown
companies_config: "companies.yaml"  # target companies (copy companies.example.yaml)

# `jobsearcher web` (the Docker service passes --host 0.0.0.0 itself).
web:
  host: "127.0.0.1"
  port: 8080
  user_name: ""          # the dashboard says "Welcome, <name>"
  allowed_hosts: []      # extra host names the chat accepts (see chat); "*" = any

# The dashboard's chat with Claude Code, run in this repository (needs the `claude`
# CLI and a checkout, so not in Docker). Uses your own Claude login or
# CLAUDE_CODE_OAUTH_TOKEN, one message at a time.
# WARNING: it runs with full access (no permission prompts) and the web UI has no
# login, so anyone who can open the page can make Claude Code read and change files
# and run commands on this machine. Enable it only on a network you trust (or Tailscale).
# It refuses requests addressed to public-looking host names (DNS rebinding); open
# the UI by IP address, or list your name under web.allowed_hosts.
chat:
  enabled: false
  model: opus
  effort: medium
  permission_mode: bypassPermissions
  timeout_s: 1800        # one reply may run this long
  # workdir: .           # the checkout Claude works in; default: the folder with this file
