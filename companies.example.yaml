# Copy to companies.yaml and edit. Target companies whose own careers sites are
# crawled for jobs, and whose news is watched for spontaneous-application signals.
#
# Per company: name, website (or careers_url when the careers page isn't linked from
# the home page), optional location (used when the ATS feed has none, e.g. Varbi),
# tags, source (where the entry came from), news_query (the GDELT query for news
# signals; needed when the name is shorter than 4 characters or ambiguous), and an
# optional manual `ats: {type, ref}` when detection gets it wrong. `enabled: false` skips one.
# `jobsearcher companies --detect` shows what was found for each.
#
# Sources:
#   syna-top100-2023   Syna, "Sveriges 100 största arbetsgivare" (ranked by employer
#                      contributions paid in Sweden, 2023): companies, national
#                      agencies, universities, and regions/municipalities within the
#                      search locations.
#   statista-2024      Statista, largest employers in Sweden by employees (2024).
#   curated:healthcare Private healthcare and pharmacy operators (candidate's background).
#   curated:international  International employers with Stockholm/Gothenburg offices,
#                      often with English as the working language.
#   curated:recruiters Recruitment and staffing agencies with HR, operations and
#                      management roles, many never advertised under the employer's name.

companies:
