[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobsearcher"
version = "0.1.0"
description = "Find, rank and draft applications for job openings."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9",
    "httpx>=0.27",
    "openai>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
jobsearcher = "jobsearcher.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
