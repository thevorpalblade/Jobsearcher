[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobsearcher"
version = "0.1.0"
description = "Find, rank and draft applications for job openings."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "openai>=1.40",
    "pydantic>=2.6",
    "pypdf>=4",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6",
    "ruamel.yaml>=0.18",
    "tzdata",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["hatchling", "pytest>=8", "respx>=0.21", "ruff>=0.5"]
# LinkedIn/Indeed via JobSpy; also provides curl_cffi for crawl.user_agent: chrome.
jobspy = ["python-jobspy>=1.2"]

[project.scripts]
jobsearcher = "jobsearcher.cli:main"

# The example configs ship inside the package, so the web UI can show them in Docker.
[tool.hatch.build.targets.wheel.force-include]
"config.example.yaml" = "jobsearcher/examples/config.example.yaml"
"ranking.example.yaml" = "jobsearcher/examples/ranking.example.yaml"
"companies.example.yaml" = "jobsearcher/examples/companies.example.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
